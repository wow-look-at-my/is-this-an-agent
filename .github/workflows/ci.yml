name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      # autorelease off: this repo has nothing to publish. The Go half is
      # consumed through go.mod and the scripts straight from the repo, so the
      # only thing a release would carry is cmd/gen-scripts -- the internal
      # generator, which belongs on nobody's machine but CI's. Without the
      # publish there is also nothing needing deployments: write or
      # artifact-metadata: write, so those grants are gone too.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

  # This library's only build check is linux (the job above) -- a build-only
  # smoke check here for every other platform this package has real per-GOOS
  # source for (proc_darwin.go, proc_other.go's windows/etc. fallback), so a
  # broken darwin build fails CI instead of surfacing only when someone
  # actually builds go-toolchain for darwin.
  cross-compile-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
