name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

  cross-compile-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          os: ${{ matrix.target.goos }}
          arch: ${{ matrix.target.goarch }}
          autorelease: 'false'

  cosmo-ape-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          targets: cosmo
          autorelease: 'false'
