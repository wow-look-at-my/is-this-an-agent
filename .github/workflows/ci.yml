name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      # see docs/CI.md
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

  # see docs/CI.md
  cross-compile-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}

  # see docs/CI.md
  cosmo-ape-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fL --compressed "https://dl.pazer.build/gosmopolitan?branch=master&os=linux&arch=amd64" | tar -xz -C "$RUNNER_TEMP"
      # see docs/CI.md
      - run: printf '%s\n' "$RUNNER_TEMP/go/bin" "$RUNNER_TEMP/go/misc/cosmo" >> "$GITHUB_PATH"
      - run: go test -count=1 ./...
        env:
          GOOS: cosmo
          GOTOOLCHAIN: local
