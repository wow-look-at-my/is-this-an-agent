name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
        with:
          autorelease: 'false'

  cross-compile-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}

  cosmo-ape-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The fork refuses a CI run with no shared cache to write to, so this job needs the config the other jobs get through their action.
      - uses: wow-look-at-my/actions@secret-server#latest
      - run: curl -fL --compressed "https://dl.pazer.build/gosmopolitan?branch=master&os=linux&arch=amd64" | tar -xz -C "$RUNNER_TEMP"
      - run: printf '%s\n' "$RUNNER_TEMP/go/bin" "$RUNNER_TEMP/go/misc/cosmo" >> "$GITHUB_PATH"
      - run: go test -count=1 ./...
        env:
          GOOS: cosmo
          GOTOOLCHAIN: local
