name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      # buildhost's publish step registers a Deployment and posts an artifact
      # storage record; job-level permissions REPLACE workflow-level ones, so
      # both belong here.
      artifact-metadata: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
